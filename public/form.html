<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulasi Cicilan — Hitung Cicilan Produk</title>
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/form.css">
</head>
<body>

  <nav>
    <a href="index.html">Katalog</a>
    <a href="form.html" aria-current="page">Simulasi Cicilan</a>
  </nav>

  <header>
    <div class="eyebrow">Rak No. 02 — Meja Kasir</div>
    <h1>Simulasi Cicilan</h1>
    <p>isi data produk, atur DP &amp; tenor, cicilan dihitung otomatis</p>
  </header>

  <main class="form-layout">
    <form id="form" novalidate>
      <label for="nama">Nama Produk</label>
      <input type="text" id="nama" placeholder="contoh: Laptop Gaming" aria-describedby="nama-error">
      <small class="error" id="nama-error" aria-live="polite"></small>

      <label for="harga">Harga (Rp)</label>
      <input type="number" id="harga" placeholder="contoh: 8000000" aria-describedby="harga-error harga-preview">
      <small class="hint" id="harga-preview"></small>
      <small class="error" id="harga-error" aria-live="polite"></small>

      
</body>
</html>
